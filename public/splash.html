<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>bindy. — clothing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;800&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #F5F1E8;
    --ink: #17130F;
    --ink-soft: rgba(23,19,15,.16);
    --glow: rgba(23,19,15,.05);
    --shadow: rgba(23,19,15,.35);
    --wordmark-size: clamp(72px, 16.5vw, 168px);
    --button-size: clamp(20px, 4.6vw, 48px);
    --font: 'League Spartan', 'Helvetica Neue', Arial, sans-serif;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; height:100%; background: var(--bg); overflow: hidden; }
  body{ -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-family: var(--font); color: var(--ink); }

  /* ---------- splash shell ---------- */
  .splash{
    position: fixed; inset: 0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background: var(--bg);
    cursor: pointer;
    transition: opacity .35s ease, visibility .35s;
    z-index: 100;
  }
  .splash[hidden]{ display:none; }
  .splash.leaving{ opacity:0; visibility:hidden; }
  .splash::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at 50% 42%, var(--glow), transparent 60%);
  }

  .buttons-layer{ position:absolute; inset:0; z-index:3; pointer-events:none; }

  /* ---------- logo ---------- */
  .logo-wrap{
    position:relative; z-index:2; text-align:center;
    opacity:0; transform: translateY(14px) scale(.97);
    transition: opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
  }
  .logo-wrap.in{ opacity:1; transform:none; }

  .wordmark{
    display:inline-flex; align-items:flex-end;
    font-weight:800; font-size: var(--wordmark-size);
    line-height:1; letter-spacing:-0.01em; white-space:nowrap;
  }
  .letter{ display:inline-block; transform-origin: bottom center; }
  .period{
    flex:none;
    width: calc(var(--wordmark-size) * .3);
    height: calc(var(--wordmark-size) * .3);
    margin-left: calc(var(--wordmark-size) * .045);
    margin-bottom: calc(var(--wordmark-size) * .02);
    border-radius:50%;
    border: calc(var(--wordmark-size) * .045) solid var(--ink-soft);
    background: transparent;
    transition: background-color .45s ease, border-color .45s ease, box-shadow .45s ease;
  }
  .period.filled{
    background: var(--ink); border-color: var(--ink);
    box-shadow: 0 8px 18px var(--shadow);
    animation: periodPop 420ms cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes periodPop{ 0%{transform:scale(.7)} 55%{transform:scale(1.16)} 100%{transform:scale(1)} }

  /* centred under the wordmark; negative margin cancels the trailing letter-spacing */
  .subline{
    display:flex; justify-content:center;
    margin-top: calc(var(--wordmark-size) * .1);
    font-weight:500;
    font-size: max(12px, calc(var(--wordmark-size) * .155));
    letter-spacing:.4em; margin-right:-.4em;
    opacity:.8;
  }

  /* ---------- skip control ---------- */
  .skip{
    position:absolute; z-index:5;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    left:50%; transform: translateX(-50%);
    font: 500 14px/1 var(--font); letter-spacing:.2em;
    color: var(--ink); background: transparent;
    border: 1px solid var(--ink-soft); border-radius: 999px;
    padding: 10px 18px; cursor:pointer; opacity:.7;
    transition: opacity .2s ease;
  }
  .skip:hover, .skip:focus-visible{ opacity:1; }
  .skip:focus-visible{ outline: 2px solid var(--ink); outline-offset: 3px; }

  /* ---------- falling / hopping buttons ---------- */
  .btn-pos{ position:absolute; top:0; left:0; width: var(--button-size); will-change: transform; }
  .btn-lift{ position:relative; transform-origin:center; will-change: transform; }
  .btn-shadow{
    position:absolute; left:50%; bottom:2%; width:74%; height:24%;
    border-radius:50%; pointer-events:none; z-index:-1; opacity:0;
    background: radial-gradient(closest-side, rgba(23,19,15,.4), rgba(23,19,15,0) 72%);
    transform: translateX(-50%) scale(.25);
  }

  .btn-img{ display:block; width:100%; aspect-ratio:1; height:auto; filter: drop-shadow(0 3px 5px rgba(40,26,12,.25)); }
  .btn-img.impact{ animation: btnImpact 320ms cubic-bezier(.33,0,.2,1); }
  @keyframes btnImpact{
    0%{ transform: scale(1,1) } 32%{ transform: scale(1.14,.84) } 62%{ transform: scale(.96,1.05) } 100%{ transform: scale(1,1) }
  }

  /* ---------- placeholder for your real site (delete when you plug in your own) ---------- */
  #site{ min-height:100vh; display:grid; place-items:center; text-align:center; padding:24px; }
  #site[hidden]{ display:none; }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap, .splash{ transition: none; }
    .period.filled{ animation: none; }
  }
</style>
<noscript>
  <style>.logo-wrap{opacity:1;transform:none}.skip{display:none}</style>
</noscript>
</head>
<body>

<div class="splash" id="stage">
  <div class="buttons-layer" id="buttonsLayer" aria-hidden="true"></div>

  <div class="logo-wrap" id="logoWrap">
    <div class="wordmark" role="img" aria-label="bindy clothing">
      <span class="letter" aria-hidden="true">b</span><span class="letter" aria-hidden="true">i</span><span class="letter" aria-hidden="true">n</span><span class="letter" aria-hidden="true">d</span><span class="letter" aria-hidden="true">y</span><span class="period" id="period" aria-hidden="true"></span>
    </div>
    <div class="subline" aria-hidden="true">clothing</div>
  </div>

  <button class="skip" id="skip" type="button">skip</button>
</div>

<!-- Replace this with your real home page. It is revealed when the splash ends. -->
<main id="site" hidden>

  // All timings in ms (your original speed)
  var TIMING = {
    entranceDelay: 550,   // after the logo fades in (must be >= the .5s logo transition)
    fall: 650,
    hop: 550,
    toPeriod: 550,
    sink: 400,
    stagger: 300,
    hold: 250             // pause on the finished logo before leaving
  };

  /* ================= elements and state ================= */
  var stage = document.getElementById('stage');
  var buttonsLayer = document.getElementById('buttonsLayer');
  var logoWrap = document.getElementById('logoWrap');
  var periodEl = document.getElementById('period');
  var site = document.getElementById('site');
  var skipBtn = document.getElementById('skip');
  var letters = Array.prototype.slice.call(document.querySelectorAll('.letter'));

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ended = false, leaving = false, periodFilled = false;
  var failsafe = null, startWidth = window.innerWidth;

  function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  function seenBefore(){
    try { return sessionStorage.getItem(STORAGE_KEY) === '1'; } catch(e){ return false; }
  }
  function markSeen(){
    try { sessionStorage.setItem(STORAGE_KEY, '1'); } catch(e){}
  }

  /* ================= hand-off to the site ================= */
  function reveal(){
    stage.hidden = true;
    if (site) site.hidden = false;
    document.body.classList.add('reveal-site');
    window.bindySplashDone = true;
    document.dispatchEvent(new CustomEvent('bindy:splash-done'));
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'bindy:splash-done' }, '*');
      }
    } catch(e){}
    if (NEXT_URL) window.location.replace(NEXT_URL);
  }

  function leave(fast){
    if (leaving) return;
    leaving = true;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'bindy:splash-lift' }, '*');
      }
    } catch(e){}
    if (fast || reduced){ reveal(); return; }
    stage.classList.add('leaving');
    setTimeout(reveal, 350);
  }

  // Ends the animation (finished, skipped, failed or resized) and moves on.
  function finish(reason){
    if (ended) return;
    ended = true;
    clearTimeout(failsafe);
    markSeen();
    logoWrap.classList.add('in');
    fillPeriod();
    buttonsLayer.textContent = '';
    if (reason === 'done')        setTimeout(function(){ leave(false); }, reduced ? 1200 : TIMING.hold);
    else if (reason === 'skip')   leave(true);
    else                          setTimeout(function(){ leave(false); }, 250);
  }

  /* ================= building blocks ================= */
  function fillPeriod(){
    if (periodFilled) return;
    periodFilled = true;
    periodEl.classList.add('filled');
  }

  function restart(el, cls){
    el.classList.remove(cls);
    void el.getBoundingClientRect();
    el.classList.add(cls);
  }

  /* ================= physics settings ================= */
  var CONTACT   = 100;   // ms the button stays pressed on a letter before it launches
  var HOP_H     = 1.4;   // hop apex height, in button sizes
  var NEST      = 0.2;   // how far the button sinks into the glyph (fraction of its size)
  var SPRING_K  = 170;   // letter spring stiffness
  var SPRING_C  = 9.1;   // letter spring damping
  var IMPULSE   = 7.8;   // squash speed given to a letter by a normal hop landing
  var REF_SPEED = 12.2;  // a "normal" landing speed, in button sizes per second

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t){ return a + (b - a) * t; }

  /* ---------- real top of each glyph (not the text box) ---------- */
  function inkTops(size){
    var cs = getComputedStyle(letters[0]);
    var fs = parseFloat(cs.fontSize), fam = cs.fontFamily, wt = cs.fontWeight;
    var fallback = fs * 0.25;
    try {
      var probe = document.createElement('div');
      probe.style.cssText = 'position:absolute;left:0;top:0;visibility:hidden;white-space:nowrap;line-height:1;' +
        'font-family:' + fam + ';font-weight:' + wt + ';font-size:' + fs + 'px';
      probe.innerHTML = '<span style="display:inline-block;width:0;height:0"></span>b';
      stage.appendChild(probe);
      var baseline = probe.firstChild.getBoundingClientRect().bottom - probe.getBoundingClientRect().top;
      stage.removeChild(probe);

      var W = Math.ceil(fs * 1.3), H = Math.ceil(fs * 1.6), base = Math.round(fs * 1.2);
      var c = document.createElement('canvas'); c.width = W; c.height = H;
      var g = c.getContext('2d', { willReadFrequently: true });
      g.font = wt + ' ' + fs + 'px ' + fam; g.textBaseline = 'alphabetic'; g.fillStyle = '#000';

      return letters.map(function(el){
        g.clearRect(0, 0, W, H);
        g.fillText(el.textContent, 0, base);
        // look at the strip of glyph the button will actually sit on
        var cx = el.getBoundingClientRect().width / 2, half = Math.max(2, size * 0.3);
        var x0 = Math.max(0, Math.floor(cx - half));
        var w = Math.max(1, Math.min(W - x0, Math.ceil(half * 2)));
        var d = g.getImageData(x0, 0, w, H).data;
        for (var y = 0; y < H; y++)
          for (var x = 0; x < w; x++)
            if (d[(y * w + x) * 4 + 3] > 60) return baseline - (base - y);
        return fallback;
      });
    } catch (e) {
      return letters.map(function(){ return fallback; });
    }
  }

  // Measure once, before any letter moves, so positions stay stable.
  function measure(){
    var s = stage.getBoundingClientRect();
    var size = Math.min(48, Math.max(20, window.innerWidth * 0.046));   // same as --button-size
    var tops = inkTops(size);
    function rel(el){
      var r = el.getBoundingClientRect();
      return { x: r.left + r.width / 2 - s.left, top: r.top - s.top, h: r.height };
    }
    var ls = letters.map(function(el, i){ var r = rel(el); r.gt = tops[i]; return r; });
    return { size: size, letters: ls, period: rel(periodEl) };
  }

  // Letters are springs: a landing pushes them down, they bounce back and wobble.
  // Buttons: gravity-style fall, constant sideways speed in the air, a short press on the
  // letter, then a launch as the letter springs back.
  function simulate(layout, sources){
    return new Promise(function(resolve){
      var size = layout.size, H = size * HOP_H;
      var L = layout.letters, P = layout.period;
      var n = L.length, total = sources.length;
      var st = L.map(function(){ return { q: 0, v: 0 }; });   // q: 0 = rest, 1 = flat

      function inkTop(i){

      }
      function restY(i){ return inkTop(i) - size * (1 - NEST); }          // button top when resting on letter i
      var periodY = P.top + P.h / 2 - size / 2;                            // button centred on the period

      function hit(i, speed){
        var k = clamp(speed / (REF_SPEED * size), 0.4, 1.5);
        st[i].v += IMPULSE * k;
      }

      function place(b, cx, y){ b.pos.style.transform = 'translate3d(' + (cx - size / 2) + 'px,' + y + 'px,0)'; }
      function pose(b, deg, sx, sy){ b.lift.style.transform = 'rotate(' + deg + 'deg) scale(' + sx + ',' + sy + ')'; }
      function shade(b, k){
        b.shadow.style.opacity = (0.16 + 0.34 * k).toFixed(3);
        b.shadow.style.transform = 'translateX(-50%) scale(' + (0.48 + 0.52 * k).toFixed(3) + ')';
      }

      function build(b, now){
        var pos = document.createElement('div');
        pos.className = 'btn-pos';
        pos.innerHTML = '<div class="btn-shadow"></div><div class="btn-lift"><img class="btn-img" alt="" src="' + sources[b.i] + '"></div>';
        buttonsLayer.appendChild(pos);
        b.pos = pos; b.lift = pos.querySelector('.btn-lift');
        b.img = pos.querySelector('.btn-img'); b.shadow = pos.querySelector('.btn-shadow');
        b.dir = 1;   // every button spins clockwise, so it rolls to the right
        b.idx = 0; b.y0 = -(size + 60);
        place(b, L[0].x, b.y0);
        b.phase = 'fall'; b.t0 = now;
      }

      function land(b, i, speed, now){
        b.idx = i;
        hit(i, speed);
        restart(b.img, 'impact');
        b.phase = 'contact'; b.t0 = now;
      }

      function launch(b, now){
        var last = b.idx === n - 1;
        b.fx = L[b.idx].x; b.fy = restY(b.idx);
        b.tx = last ? P.x : L[b.idx + 1].x;
        b.toPeriod = last;
        b.dur = (last ? TIMING.toPeriod : TIMING.hop) - CONTACT;
        b.phase = 'air'; b.t0 = now;
      }

      function step(b, now){
        var t;
        if (b.phase === 'idle'){
          if (now - T0 < b.i * TIMING.stagger) return;
          build(b, now);
        }
        if (b.phase === 'fall'){
          t = (now - b.t0) / TIMING.fall;
          var y1 = restY(0);
          if (t >= 1){ land(b, 0, 2 * (y1 - b.y0) / TIMING.fall * 1000, now); t = 1; }
          var y = lerp(b.y0, y1, t * t);                                  // constant gravity: y grows with t squared
          place(b, L[0].x, y);
          var sy = t < 0.72 ? 1 + 0.2 * (t / 0.72) : 1 + 0.2 * (1 - (t - 0.72) / 0.28);
          pose(b, 0, Math.pow(sy, -0.76), sy);
          shade(b, t); b.shadow.style.opacity = (0.5 * t).toFixed(3);
        } else if (b.phase === 'contact'){
          t = (now - b.t0) / CONTACT;
          place(b, L[b.idx].x, restY(b.idx));                              // rides the squashed letter down
          pose(b, 0, 1, 1); shade(b, 1);
          if (t >= 1) launch(b, now);
        } else if (b.phase === 'air'){
          t = clamp((now - b.t0) / b.dur, 0, 1);
          var ty = b.toPeriod ? periodY : restY(b.idx + 1);                // aim at where the letter is now
          var line = lerp(b.fy, ty, t);
          var yy = line - 4 * H * t * (1 - t);                             // parabola: only height follows gravity
          place(b, lerp(b.fx, b.tx, t), yy);                               // sideways speed is constant
          pose(b, b.dir * 360 * t, 1, 1);
          shade(b, 1 - clamp((line - yy) / H, 0, 1));
          if (t >= 1){
            if (b.toPeriod){
              fillPeriod();
              b.img.style.transition = 'transform ' + TIMING.sink + 'ms cubic-bezier(.22,1,.36,1), opacity ' + TIMING.sink + 'ms ease';
              b.img.style.transform = 'scale(.15)'; b.img.style.opacity = '0';
              b.phase = 'sink'; b.t0 = now;
            } else {
              land(b, b.idx + 1, ((ty - b.fy) + 4 * H) / b.dur * 1000, now);
            }
          }
        } else if (b.phase === 'sink'){
          if (now - b.t0 >= TIMING.sink){ b.pos.remove(); b.phase = 'done'; finished++; }
        }
      }

      for (var i = 0; i < total; i++) btns.push({ i: i, phase: 'idle' });

      function tick(now){
        if (ended){ letters.forEach(function(el){ el.style.transform = ''; }); return; }
        var dt = Math.min(0.033, (now - last) / 1000); last = now;

        var h = dt / 2;                                                    // two sub-steps keep the spring stable
        for (var s2 = 0; s2 < 2; s2++){
          for (var k = 0; k < n; k++){
            var a = -SPRING_K * st[k].q - SPRING_C * st[k].v;
            st[k].v += a * h;
            st[k].q = clamp(st[k].q + st[k].v * h, -0.15, 0.6);
          }
        }
        for (var m = 0; m < n; m++){
          letters[m].style.transform = 'scale(' + (1 + 0.37 * st[m].q).toFixed(4) + ',' + (1 - st[m].q).toFixed(4) + ') translateY(' + (29 * st[m].q).toFixed(3) + '%)';
        }

        for (var j = 0; j < total; j++) if (btns[j].phase !== 'done') step(btns[j], now);

        if (finished === total && !resolved){ resolved = true; resolve(); }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  /* ================= sequence ================= */
  async function play(){
    // Do not wait on a slow font or image forever: 1.5 s at most, then continue with the fallback.
    var decoded = BUTTON_SOURCES.map(function(src){
      var im = new Image(); im.src = src;
      return im.decode ? im.decode().catch(function(){}) : Promise.resolve();
    });
    await Promise.race([ Promise.all([ document.fonts ? document.fonts.ready : Promise.resolve() ].concat(decoded)), wait(1500) ]);
    if (ended) return;
    logoWrap.classList.add('in');
    await wait(TIMING.entranceDelay);
    if (ended) return;

    await simulate(measure(), BUTTON_SOURCES);
    finish('done');
  }

  /* ================= start-up ================= */
  var force = /[?&]splash(=|&|$)/.test(window.location.search);   // add ?splash to the URL to replay it

  if (SHOW_ONCE && seenBefore() && !force){
    ended = leaving = true;
    reveal();
    return;
  }

  failsafe = setTimeout(function(){ finish('failsafe'); }, FAILSAFE_MS);

  // Skip: click or tap anywhere, the skip button, Escape, Enter or Space
  stage.addEventListener('click', function(){ finish('skip'); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') finish('skip');
  });

  // Letter positions change if the window width changes mid-animation, so end cleanly.
  window.addEventListener('resize', function(){
    if (!ended && Math.abs(window.innerWidth - startWidth) > 40) finish('resize');
  });

  if (reduced){
    logoWrap.classList.add('in');
    fillPeriod();
    ended = true; markSeen();
    setTimeout(function(){ leave(false); }, 1200);
  } else {
    play().catch(function(){ finish('failsafe'); });
  }
})();
</script>
